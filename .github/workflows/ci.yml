name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfv
          POSTGRES_PASSWORD: lfv
          POSTGRES_DB: light_for_volunteer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfv -d light_for_volunteer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: lfv
      DATABASE_PASSWORD: lfv
      DATABASE_NAME: light_for_volunteer
      DATABASE_SYNC: "true"
      DATABASE_MIGRATIONS_RUN: "false"
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      JWT_REFRESH_TTL_SECONDS: "604800"
      REFRESH_GRACE_SECONDS: "60"
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      THROTTLE_AUTH_TTL: "60"
      THROTTLE_AUTH_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Jest can only require() NestJS 12's ESM packages on Node 24.9+
          # (vm.SourceTextModule.hasAsyncGraph), same major as local dev.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @lfv/types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
